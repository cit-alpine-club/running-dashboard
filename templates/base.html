<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ランニング管理{% endblock %} | 千葉工業大学山岳部</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    body { background: #f0f2f5; font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; }
    .navbar-custom { background: #1a1a2e; padding: 0.9rem 0; }
    .navbar-custom .navbar-brand {
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
    }
    .card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
    }
    .card-title { font-weight: 700; font-size: 1rem; }
    .rank-badge {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.75rem; color: #fff;
      flex-shrink: 0;
    }
    .member-card {
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
      text-decoration: none !important;
    }
    .member-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.13) !important;
    }
    .stat-value { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
    .stat-label { font-size: 0.78rem; color: #6c757d; margin-top: 2px; }
    .table th { font-size: 0.82rem; font-weight: 600; }
    .table td { font-size: 0.88rem; vertical-align: middle; }
    h2 { font-weight: 800; }
    h5 { font-weight: 700; }
  </style>
</head>
<body>
  <nav class="navbar-custom mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="/">&#127956; 千葉工業大学山岳部 ランニング管理</a>
      {% block nav_extra %}{% endblock %}
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
